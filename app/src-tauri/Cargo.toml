[package]
name = "rvc-fabric"
version = "1.3.0"
description = "RVC Fabric desktop shell (Tauri + React)"
authors = ["Turing Mirror"]
edition = "2021"

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Multi-part HTTP range downloader (https://github.com/sam0x17/ripget) — aria2-style
ripget = "0.3"
tokio = { version = "1", features = ["rt-multi-thread", "time", "macros", "sync"] }
# Catalog JSON fetch (lightweight)
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls"] }
sha2 = "0.10"
hex = "0.4"
tar = "0.4"
flate2 = "1"
zip = { version = "2", default-features = false, features = ["deflate"] }
rfd = "0.15"
regex = "1"
