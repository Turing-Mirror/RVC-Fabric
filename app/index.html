<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>RVC Fabric</title>
    <style>
      /* Boot screen only. Deliberately self-contained: if the bundle's CSS is
         the thing that failed to load, this still has to be readable. */
      #boot {
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
        justify-content: center;
        gap: 10px;
        padding: 0 56px;
        font:
          14px/1.7 -apple-system,
          "Segoe UI",
          "Microsoft YaHei UI",
          sans-serif;
        color: #5d6874;
        background: #f4f6f8;
        -webkit-user-select: text;
        user-select: text;
      }
      #boot-title {
        font-size: 17px;
        color: #1e242b;
      }
      #boot-detail {
        display: none;
        white-space: pre-wrap;
        word-break: break-all;
        max-height: 46vh;
        overflow: auto;
        font-family: ui-monospace, Consolas, "Courier New", monospace;
        font-size: 12px;
        color: #8a949e;
      }
      @media (prefers-color-scheme: dark) {
        #boot {
          color: #a9b3be;
          background: #171b22;
        }
        #boot-title {
          color: #e4e9ef;
        }
      }
    </style>
    <script>
      /* Blank-window guard.
       *
       * Plain inline script in <head> on purpose:
       *   - not a module, so it still runs when the bundle 404s or throws —
       *     that is exactly the case where nothing inside the bundle (React
       *     error boundaries included) ever executes and the window is simply
       *     white with no way for the user to tell us why;
       *   - before Vite's injected <script>/<link>, so the capture listener is
       *     already installed when their load errors fire.
       * DOM lookups are therefore lazy: <body> does not exist yet here. */
      (function () {
        var reported = false;

        function el(id) {
          return document.getElementById(id);
        }

        function toShellLog(line) {
          try {
            var internals = window.__TAURI_INTERNALS__;
            if (internals && internals.invoke) {
              internals.invoke("ui_log", { line: String(line) });
            }
          } catch (e) {
            /* logging must never be the thing that breaks */
          }
        }

        function fail(headline, info) {
          if (reported) return;
          reported = true;
          toShellLog(headline + " | " + info);
          var boot = el("boot");
          if (!boot) return; // React already replaced it — nothing to paint on
          el("boot-title").textContent = headline;
          el("boot-msg").textContent =
            "界面没能载入。请把 User_Data\\logs\\shell.log 发给我们。";
          var detail = el("boot-detail");
          detail.textContent = info;
          detail.style.display = "block";
        }

        /* Resource errors (a 404 on the bundle) do not bubble, hence capture. */
        window.addEventListener(
          "error",
          function (e) {
            var el = e.target;
            if (el && el !== window && (el.src || el.href)) {
              fail("界面资源载入失败", (el.src || el.href) + " 未能载入");
              return;
            }
            fail(
              "界面脚本出错",
              (e.message || "unknown") +
                "\n" +
                (e.filename || "") +
                ":" +
                (e.lineno || 0) +
                "\n" +
                ((e.error && e.error.stack) || ""),
            );
          },
          true,
        );

        window.addEventListener("unhandledrejection", function (e) {
          var r = e.reason;
          /* Message first: WebKit stacks do not carry it. */
          fail(
            "界面出错",
            r && r.message
              ? r.message + "\n" + (r.stack || "")
              : String(r),
          );
        });

        /* Nothing threw, nothing 404'd, and still no UI — the case the two
         * handlers above cannot catch (a script that parsed but never reached
         * render). React clears #root on mount, so a surviving #boot means it
         * never got there. 8s is well past a cold start on a slow disk. */
        setTimeout(function () {
          if (el("boot")) {
            fail("界面载入超时", "8 秒内界面没有挂载；脚本没有报错。");
          }
        }, 8000);
      })();
    </script>
  </head>
  <body>
    <div id="root">
      <div id="boot">
        <div id="boot-title">正在载入界面…</div>
        <div id="boot-msg"></div>
        <div id="boot-detail"></div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
