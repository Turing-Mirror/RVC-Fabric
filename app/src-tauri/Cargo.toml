[package]
name = "rvc-fabric"
version = "1.3.0"
description = "RVC Fabric desktop shell (Tauri + React)"
authors = ["Turing Mirror"]
edition = "2021"
# Extra [[bin]] (catalog-check) requires an explicit default for tauri build.
default-run = "rvc-fabric"

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[[bin]]
name = "rvc-fabric"
path = "src/main.rs"

[[bin]]
name = "catalog-check"
path = "src/bin/catalog-check.rs"

[dependencies]
tauri = { version = "2", features = ["protocol-asset", "tray-icon", "image-png"] }
tauri-plugin-opener = "2"
tauri-plugin-global-shortcut = "2"
tauri-plugin-updater = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Multi-part HTTP range downloader (https://github.com/sam0x17/ripget) — aria2-style
ripget = "0.3"
tokio = { version = "1", features = ["rt-multi-thread", "time", "macros", "sync"] }
# Catalog JSON fetch (lightweight)
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls"] }
sha2 = "0.10"
hex = "0.4"
tar = "0.4"
flate2 = "1"
zip = { version = "2", default-features = false, features = ["deflate"] }
rfd = "0.15"
regex = "1"
# Local-time stamps for diagnostics / consult filenames (support reads these)
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
