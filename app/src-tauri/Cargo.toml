[package]
name = "rvc-fabric"
version = "1.3.0"
description = "RVC Fabric desktop shell (Tauri + React)"
authors = ["Turing Mirror"]
edition = "2021"

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
