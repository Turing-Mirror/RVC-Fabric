[package]
name = "rvc-fabric"
version = "1.5.3"
description = "RVC Fabric desktop shell (Tauri + React)"
authors = ["Turing Mirror"]
edition = "2021"
# Extra [[bin]] (catalog-check) requires an explicit default for tauri build.
default-run = "rvc-fabric"

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[[bin]]
name = "rvc-fabric"
path = "src/main.rs"

[[bin]]
name = "catalog-check"
path = "src/bin/catalog-check.rs"

[dependencies]
tauri = { version = "2", features = ["protocol-asset", "tray-icon", "image-png"] }
tauri-plugin-opener = "2"
tauri-plugin-global-shortcut = "2"
tauri-plugin-updater = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Multi-part HTTP range downloader (https://github.com/sam0x17/ripget) — aria2-style
ripget = "0.3"
tokio = { version = "1", features = ["rt-multi-thread", "time", "macros", "sync"] }
# Catalog JSON fetch (lightweight)
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls"] }
sha2 = "0.10"
hex = "0.4"
tar = "0.4"
flate2 = "1"
zip = { version = "2", default-features = false, features = ["deflate"] }
rfd = "0.15"
regex = "1"
# Local-time stamps for diagnostics / consult filenames (support reads these)
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }

# Process liveness without spawning a helper process. The status poll runs
# every 400 ms while converting; shelling out to tasklist / powershell there
# was costing more CPU than the conversion itself.
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = [
  "Win32_Foundation",
  "Win32_System_Threading",
  "Win32_System_Registry",
  # RegCreateKeyExW 引用 SECURITY_ATTRIBUTES（Win32_Security），
  # 开机自启（autostart.rs）需要它创建 Run 键。
  "Win32_Security",
  # 无边框窗口的圆角靠 DWM 属性，不靠透明窗口 + CSS 圆角 —— 后者会连系统
  # 投影一起丢掉，四角还会露出锯齿。
  "Win32_Graphics_Dwm",
  # Win10 上 DWM 那条属性不存在，兜底靠 SetWindowRgn 自己裁圆角。
  # SetWindowRgn 虽然是 user32 的函数，windows-sys 把它归在 Gdi 这个 feature 下。
  "Win32_Graphics_Gdi",
  # 无边框窗口的样式与最大化矩形：GetWindowLong / SetWindowPos / MINMAXINFO。
  "Win32_UI_WindowsAndMessaging",
  # 无边框最大化：子类化 WM_GETMINMAXINFO / WM_WINDOWPOSCHANGING，
  # 落地前把矩形钳到工作区（不含任务栏），避免事后 SetWindowPos 毁掉还原尺寸。
  "Win32_UI_Shell",
  # 退出/关变声时枚举 Runtime 下残留的 python*.exe（含 AudioIoProcess 孤儿）。
  "Win32_System_Diagnostics_ToolHelp",
] }
